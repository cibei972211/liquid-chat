name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform files
        run: |
          rm -rf ios
          flutter create . --org com.liquidchat

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS IPA (no codesign)
        run: flutter build ipa --no-codesign --release

      - name: Package IPA
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Found IPA at: $IPA_PATH"
          cp "$IPA_PATH" LiquidChat.ipa
          ls -lh LiquidChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidChat-iOS
          path: LiquidChat.ipa
          retention-days: 30
