name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform files
        run: |
          rm -rf ios
          flutter create . --org com.liquidchat

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Build iOS (no codesign)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build -name "Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LiquidChat.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully"
          ls -lh LiquidChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidChat-iOS
          path: LiquidChat.ipa
          retention-days: 30
