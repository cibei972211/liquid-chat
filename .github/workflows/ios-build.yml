name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform files
        run: |
          rm -rf ios
          flutter create . --org com.liquidchat

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r LiquidChat.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully"
          ls -lh LiquidChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidChat-iOS
          path: build/ios/iphoneos/LiquidChat.ipa
          retention-days: 30
