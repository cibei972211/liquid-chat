name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform files
        run: |
          rm -rf ios
          flutter create . --org com.liquidchat --platforms ios
          # Flutter 3.47+ no longer generates ios/Podfile; restore it (and the
          # custom app config) from the committed repo files
          git checkout -- ios/Podfile ios/Runner/Info.plist ios/Runner/AppDelegate.swift
          test -f ios/Podfile || { echo "ERROR: ios/Podfile missing"; exit 1; }
          ls -la ios

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS config
        run: flutter build ios --release --no-codesign --config-only

      - name: Pod install
        run: |
          cd ios
          pod install
          # Flutter 3.47 defaults to SPM and no longer adds the CocoaPods
          # xcconfig includes, leaving PODS_ROOT undefined for raw xcodebuild.
          grep -q 'Pods-Runner.release' Flutter/Release.xcconfig 2>/dev/null || printf '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"\n' >> Flutter/Release.xcconfig
          grep -q 'Pods-Runner.debug' Flutter/Debug.xcconfig 2>/dev/null || printf '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"\n' >> Flutter/Debug.xcconfig
          echo "--- Release.xcconfig ---"; cat Flutter/Release.xcconfig
          echo "--- Debug.xcconfig ---"; cat Flutter/Debug.xcconfig

      - name: Build with xcodebuild (no codesign)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build -name "Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find ios/build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LiquidChat.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully"
          ls -lh LiquidChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidChat-iOS
          path: LiquidChat.ipa
          retention-days: 30
