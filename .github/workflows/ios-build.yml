name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform files
        run: |
          rm -rf ios
          flutter create . --org com.liquidchat

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign, ignore Flutter team check)
        run: |
          flutter build ios --release --no-codesign || true
          echo "=== Checking build output ==="
          ls -la build/ios/iphoneos/ 2>/dev/null || echo "iphoneos dir not found"
          find build -name "Runner.app" -type d 2>/dev/null || echo "Runner.app not found"

      - name: Package IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ -d "$APP_PATH" ]; then
            echo "Found Runner.app, packaging IPA..."
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r LiquidChat.ipa Payload
            rm -rf Payload
            echo "IPA packaged successfully"
            ls -lh LiquidChat.ipa
          else
            echo "ERROR: Runner.app not found"
            find build -name "*.app" -type d
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidChat-iOS
          path: LiquidChat.ipa
          retention-days: 30
